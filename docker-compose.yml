services:
  web:
    build: .
    container_name: job_tracker_backend
    restart: always

    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 120
      "

    ports:
      - "8000:8000"

    env_file:
      - .env
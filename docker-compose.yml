services:
  redis:
    image: redis:7-alpine
    container_name: job_tracker_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: job_tracker_backend
    restart: always
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
      "
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: job_tracker_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis

  celery_beat:
    build: .
    container_name: job_tracker_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
name: Deploy Job Tracker Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: job_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d job_tracker_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py test applications

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t job-tracker-backend:latest .

  migrate:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: migration_dummy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d migration_dummy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Production Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py migrate

  deploy-render:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs:
      - test
      - migrate

    steps:
      - name: Trigger Render Deployment
        run: |
          curl --fail --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-celery:
    name: Deploy Celery to Oracle VM
    runs-on: ubuntu-latest
    needs:
      - test
      - migrate

    steps:
      - name: Deploy Celery Worker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/job-tracker-backend
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            pip install --only-binary=:all: -r requirements.txt
            sudo systemctl restart job-tracker-celery
            sudo systemctl is-active --quiet job-tracker-celery
name: Deploy Job Tracker Backend (Web & Celery)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build-deploy:
    name: Test, Build Docker & Deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: job_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d job_tracker_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py test applications

      - name: Build Docker Image
        run: |
          docker build -t job-tracker-backend:latest .

      - name: Run Production Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py migrate

      - name: Trigger Web & Celery Production Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

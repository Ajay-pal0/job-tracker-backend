name: Periodic Gmail Application Synchronization

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-gmail-job-applications:
    name: Sync Gmail Applications Across Users
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Trigger Internal API Sync Endpoint
        if: env.BACKEND_URL != ''
        run: |
          echo "Triggering Gmail sync via Internal API endpoint..."
          curl -X POST "${BACKEND_URL}/api/applications/gmail/cron-sync/" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --fail --show-error --silent | jq .

      - name: Checkout Repository
        if: env.BACKEND_URL == ''
        uses: actions/checkout@v4

      - name: Setup Python
        if: env.BACKEND_URL == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        if: env.BACKEND_URL == ''
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Django Management Command
        if: env.BACKEND_URL == ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python manage.py sync_gmail
